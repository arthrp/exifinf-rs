<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exif Remover</title>
    <style>
        * { box-sizing: border-box; }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            max-width: 560px;
            margin: 2rem auto;
            padding: 0 1rem;
            color: #1a1a1a;
            line-height: 1.5;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 0.25rem;
        }

        .subtitle {
            color: #666;
            margin-bottom: 1.5rem;
        }

        #dropzone {
            border: 2px dashed #ccc;
            border-radius: 8px;
            padding: 2.5rem 1rem;
            text-align: center;
            cursor: pointer;
            transition: border-color 0.15s, background 0.15s;
        }

        #dropzone:hover,
        #dropzone.dragover {
            border-color: #0066cc;
            background: #f0f7ff;
        }

        #dropzone p { margin: 0; }

        #dropzone .hint {
            font-size: 0.875rem;
            color: #888;
            margin-top: 0.5rem;
        }

        #file-input { display: none; }

        #status {
            margin-top: 1.25rem;
            font-size: 0.9rem;
        }

        #status.error { color: #c00; }
        #status.success { color: #060; }

        #result {
            margin-top: 1rem;
            display: none;
        }

        #result.visible { display: block; }

        .size-info {
            font-size: 0.875rem;
            color: #555;
            margin-bottom: 0.75rem;
        }

        #download-link {
            display: inline-block;
            padding: 0.5rem 1.25rem;
            background: #0066cc;
            color: #fff;
            text-decoration: none;
            border-radius: 6px;
            font-size: 0.9rem;
        }

        #download-link:hover { background: #0052a3; }

        #loading {
            display: none;
            margin-top: 1.25rem;
            color: #666;
            font-size: 0.9rem;
        }

        #loading.visible { display: block; }
    </style>
</head>
<body>
    <h1>Exif Remover</h1>
    <p class="subtitle">Strip metadata from JPG or PNG images. Processing happens entirely in your browser.</p>

    <div id="dropzone">
        <p>Drop an image here or click to choose</p>
        <p class="hint">JPEG and PNG only</p>
    </div>
    <input type="file" id="file-input" accept="image/jpeg,image/png,.jpg,.jpeg,.png">

    <div id="loading">Processing…</div>
    <div id="status"></div>
    <div id="result">
        <p class="size-info" id="size-info"></p>
        <a id="download-link" download>Download cleaned image</a>
    </div>

    <script type="module">
        import init, { strip_metadata } from './exifinf.js';

        const dropzone = document.getElementById('dropzone');
        const fileInput = document.getElementById('file-input');
        const status = document.getElementById('status');
        const loading = document.getElementById('loading');
        const result = document.getElementById('result');
        const sizeInfo = document.getElementById('size-info');
        const downloadLink = document.getElementById('download-link');

        let isWasmReady = false;
        let downloadUrl = null;

        function formatBytes(n) {
            if (n < 1024) return `${n} B`;
            if (n < 1024 * 1024) return `${(n / 1024).toFixed(1)} KB`;
            return `${(n / (1024 * 1024)).toFixed(2)} MB`;
        }

        function setStatus(msg, type = '') {
            status.textContent = msg;
            status.className = type;
        }

        function clearResult() {
            if (downloadUrl) {
                URL.revokeObjectURL(downloadUrl);
                downloadUrl = null;
            }
            result.classList.remove('visible');
        }

        function isAllowedType(type) {
            return type === 'image/jpeg' || type === 'image/png';
        }

        async function processFile(file) {
            if (!isAllowedType(file.type)) {
                setStatus('Please choose a JPG or PNG file.', 'error');
                return;
            }

            clearResult();
            setStatus('');
            loading.classList.add('visible');

            try {
                if (!isWasmReady) {
                    await init();
                    isWasmReady = true;
                }

                const bytes = new Uint8Array(await file.arrayBuffer());
                const cleaned = strip_metadata(bytes, undefined);

                downloadUrl = URL.createObjectURL(new Blob([cleaned], { type: file.type }));
                downloadLink.href = downloadUrl;
                downloadLink.download = file.name;

                const removed = bytes.length - cleaned.length;
                sizeInfo.textContent =
                    `${formatBytes(bytes.length)} → ${formatBytes(cleaned.length)}` +
                    (removed > 0 ? ` (${formatBytes(removed)} removed)` : ' (no metadata found)');

                result.classList.add('visible');
                setStatus('Metadata stripped successfully.', 'success');
            } catch (err) {
                setStatus(err.message || String(err), 'error');
            } finally {
                loading.classList.remove('visible');
            }
        }

        dropzone.addEventListener('click', () => fileInput.click());

        fileInput.addEventListener('change', () => {
            const file = fileInput.files[0];
            if (file) processFile(file);
            fileInput.value = '';
        });

        dropzone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropzone.classList.add('dragover');
        });

        dropzone.addEventListener('dragleave', () => {
            dropzone.classList.remove('dragover');
        });

        dropzone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropzone.classList.remove('dragover');
            const file = e.dataTransfer.files[0];
            if (file) processFile(file);
        });
    </script>
</body>
</html>
